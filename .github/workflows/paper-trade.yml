name: Paper trade

# Runs the paper-trading engine every hour on live Deriv candle prices and publishes the results to the
# `paper-data` branch. The site reads them from there. Nothing here touches `main` or the deployed site.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout engine code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load the paper-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REPO_URL" paper-data >/dev/null 2>&1; then
            git clone --depth 1 --branch paper-data "$REPO_URL" paper-data
          else
            mkdir paper-data
            git -C paper-data init -b paper-data
            git -C paper-data remote add origin "$REPO_URL"
          fi

      - name: Run the paper engine
        run: node engine/run-paper.mjs --data paper-data

      - name: Publish results
        run: |
          cd paper-data
          git config user.name "paper-trade-bot"
          git config user.email "paper-trade-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "paper: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:paper-data
          fi
